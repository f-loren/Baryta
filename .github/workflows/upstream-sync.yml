# Merges each new NegPy release into Baryta's main. A clean merge that passes the tests lands on
# main; a conflict or a red test opens an issue and leaves the sync branch for a person.
name: NegPy Sync

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: upstream-sync

env:
  UPSTREAM: https://github.com/marcinz606/NegPy

jobs:
  merge:
    name: Merge the newest NegPy release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      status: ${{ steps.merge.outputs.status || 'none' }}
      conflicts: ${{ steps.merge.outputs.conflicts }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Find the newest release not yet in main
        id: find
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet --no-tags upstream '+refs/tags/*:refs/upstream-tags/*'
          tag=$(git for-each-ref --sort=-v:refname --format='%(refname:strip=2)' refs/upstream-tags \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$tag" ] || git merge-base --is-ancestor "refs/upstream-tags/$tag" HEAD; then
            echo "Main already holds NegPy ${tag:-releases}."
          elif git ls-remote --exit-code --heads origin "sync/negpy-$tag" > /dev/null; then
            # A sync branch marks a release a person already has an issue for.
            echo "sync/negpy-$tag exists: waiting on a person."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge it on a sync branch
        id: merge
        if: steps.find.outputs.tag != ''
        env:
          TAG: ${{ steps.find.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "sync/negpy-$TAG"
          if git merge --no-edit -m "Merge NegPy $TAG" "refs/upstream-tags/$TAG"; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=$(git diff --name-only --diff-filter=U | paste -sd ' ')" >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi
          git push origin "sync/negpy-$TAG"

  test:
    name: Test the merge
    needs: merge
    if: needs.merge.outputs.status == 'clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sync/negpy-${{ needs.merge.outputs.tag }}

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.13

      - name: Set up Rust
        working-directory: negpy_core
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: negpy_core

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libgl1

      - run: uv sync --group dev --group plustek --group pieusb

      - run: uv run ruff check .

      - run: uv run pytest tests/ -q

  land:
    name: Put the merge on main
    needs: [merge, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sync/negpy-${{ needs.merge.outputs.tag }}
          fetch-depth: 0

      # Fast-forward only: if main moved during the run, the push fails and the issue step reports it.
      - run: |
          git push origin "HEAD:main"
          git push origin --delete "sync/negpy-${{ needs.merge.outputs.tag }}"

  report:
    name: Open an issue for a person
    needs: [merge, test, land]
    if: always() && needs.merge.outputs.tag != '' && (needs.merge.outputs.status == 'conflict' || needs.test.result == 'failure' || needs.land.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.merge.outputs.tag }}
          STATUS: ${{ needs.merge.outputs.status }}
          CONFLICTS: ${{ needs.merge.outputs.conflicts }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "conflict" ]; then
            reason="The merge has conflicts in: $CONFLICTS"
          else
            reason="The merge is on the branch sync/negpy-$TAG, but the tests or the push to main failed."
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "NegPy $TAG needs a manual merge" \
            --body "$reason

          Run: $RUN

          Delete the branch sync/negpy-$TAG after the fix, so the next release syncs again."
